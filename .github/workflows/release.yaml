name: "Release dev container features & Generate Documentation"
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: "Publish Features"
        uses: devcontainers/action@v1
        with:
          publish-features: "true"
          base-path-to-features: "./src"
          generate-docs: "true"

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated documentation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          # Stage the per-feature README(s) regenerated by the publish step.
          git add */**/README.md
          if git diff --cached --quiet; then
            echo "No documentation changes to commit."
            exit 0
          fi
          # Commit straight to main. '[skip ci]' stops this push from
          # re-triggering the release workflow. Publishing already succeeded, so
          # a rejected push (e.g. branch protection) must not fail the release.
          git commit -m 'Automated documentation update [skip ci]'
          git push origin HEAD:main \
            || echo "Could not push docs to main (branch protection?); skipping."
